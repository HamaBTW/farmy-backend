name: Build and Deploy Backend
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
      env:
        CI: false
    - name: Debug working directory
      run: |
        echo "Current working directory:"
        pwd
        echo "Contents of working directory:"
        ls -R
    - name: Build Node.js App
      run: npm run build
      env:
        CI: false
    - name: Debug source directories
      run: |
        echo "Contents of src/uploads:"
        ls -l src/uploads || echo "src/uploads does not exist"
    - name: Copy additional directories
      run: |
        mkdir -p dist/uploads
        echo "Copying uploads..."
        cp -rv src/uploads/* dist/uploads || echo "No uploads to copy"
    - name: Verify copied directories
      run: |
        echo "Contents of dist/uploads:"
        ls -l dist/uploads || echo "dist/uploads does not exist"
    - uses: a7ul/tar-action@v1.1.0
      with:
        command: c
        cwd: "./"
        files: |
          dist/
          dist/uploads/
          package.json
          package-lock.json
          config
          config-definition
          firebase-service-account.json
        outPath: deploy.tar
    - name: Deploy
      uses: caprover/deploy-from-github@v1.0.1
      with:
        server: '${{ secrets.HOSTING_SERVER }}'
        app: '${{ secrets.APP_NAME }}'
        token: '${{ secrets.APP_TOKEN }}'
